# Validates that PR titles follow the Conventional Commits specification.
# This ensures the squash-merge commit message (which defaults to the PR title)
# is always machine-parseable for automated changelogs and semantic versioning.
#
# Conventional Commits format: <type>[optional scope]: <description>
# Examples:  feat: add JWKS cache refresh metrics
#            fix(proxy): strip X-Forwarded-For before forwarding
#            chore!: drop support for Go 1.21
#
# See https://www.conventionalcommits.org for the full specification.

name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed conventional commit types.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Require a scope to always be lowercase.
          requireScope: false
          # Disallow scopes that don't match the allowed list (optional guard).
          # scopes: |
          #   proxy
          #   jwt
          #   config
          #   ci
          # Warn (rather than fail) when the subject starts with an uppercase letter.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >
            The subject "{subject}" found in the pull request title "{title}"
            must start with a lowercase letter.
            More information: https://www.conventionalcommits.org
