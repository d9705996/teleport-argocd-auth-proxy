name: Lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false  # golangci-lint action manages its own cache

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # goinstall compiles golangci-lint from source using the Go toolchain
          # set up above, ensuring it is built with the same Go version as the
          # project (go1.25.6) and avoids the "built with goX lower than target"
          # error that pre-built binaries trigger.
          install-mode: goinstall
          args: --timeout=5m
