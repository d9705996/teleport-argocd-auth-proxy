run:
  timeout: 5m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - copyloopvar
    - gosec
    - noctx
    - bodyclose
    - contextcheck
    - exhaustive
    - gocritic
    - godot
    - nolintlint
    - prealloc
    - unparam
    - whitespace

linters-settings:
  goimports:
    local-prefixes: github.com/d9705996/teleport-argocd-auth-proxy
  gosec:
    excludes:
      - G108  # profiling endpoint – not applicable
  revive:
    rules:
      - name: exported
        severity: warning
      - name: var-naming
        severity: warning
  godot:
    scope: declarations

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - unparam
  max-issues-per-linter: 0
  max-same-issues: 0
